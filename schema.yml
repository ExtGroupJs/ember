components:
  schemas:
    ArchiveItems:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        deletion_cause:
          type: string
          nullable: true
      required:
      - id
    Classification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
          maxLength: 256
        parent:
          type: integer
          nullable: true
        full_hierarchy:
          type: string
          readOnly: true
      required:
      - full_hierarchy
      - id
      - name
      - parent
    Destination:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 30
        enabled:
          type: boolean
      required:
      - id
      - name
    EmployeeArea:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 30
        description:
          type: string
          maxLength: 256
      required:
      - description
      - id
      - name
    EmployeeResponsability:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 30
        description:
          type: string
          maxLength: 256
      required:
      - description
      - id
      - name
    Entity:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 30
        email:
          type: string
          format: email
          maxLength: 254
        enabled:
          type: boolean
        phone_1:
          type: string
          nullable: true
          title: Phone number 1
          pattern: ^\+?\d+$
          maxLength: 11
        phone_2:
          type: string
          nullable: true
          title: Phone number 2
          pattern: ^\+?\d+$
          maxLength: 11
      required:
      - email
      - id
      - name
    Format:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 30
        description:
          type: string
          nullable: true
          maxLength: 256
      required:
      - id
      - name
    GenderEnum:
      enum:
      - M
      - F
      type: string
